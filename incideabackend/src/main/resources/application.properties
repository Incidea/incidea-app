spring.application.name=incideabackend

# Actuator: only health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.endpoints.web.base-path=/api/v1

spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true

spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:54321/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://supabase_kong_incidea-app:8000/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

app.cors.allowed-origins="http://localhost:3000"

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
