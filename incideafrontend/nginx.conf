server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed Vite assets: safe to cache forever (same semantics as Vercel).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry document, otherwise deploys look "stuck".
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: deep links such as /login work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Backend on the same origin: frontend always calls /api, no CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
