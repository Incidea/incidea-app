name: incidea-prod

services:
  react:
    image: incidea-frontend:prod
    build:
      context: ../incideafrontend/
      dockerfile: Dockerfile
    container_name: react-prod
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: incidea-backend:prod
    build:
      context: ../incideabackend/
      dockerfile: Dockerfile
    container_name: backend-prod
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/postgres}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "8082:8080"
    networks:
      - default
      - supabase
    restart: unless-stopped

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_network_incidea-app}
